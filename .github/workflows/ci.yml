name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Supabase env. The anon key is JWT-public; the service-role key is needed
  # so anonymous-visitor flows (enquiry intake) can pass RLS.
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  NEXT_PUBLIC_SITE_URL: https://www.bazarrealestate.ae

# One build per run, and never while Vercel is building.
#
# Every job used to build the app for itself — this one, E2E (inside
# Playwright's webServer) and both Lighthouse runs — so a run was four full
# prerenders of ~1,030 pages, all reading the ONE Supabase project production
# serves from, and a merge added Vercel's production build on top. PostgREST's
# connection pool cannot serve that many at once. On 2026-09-27 it cost #553
# its production deploy (the numbers are in scripts/ci/wait-for-vercel.mjs);
# builds in runs that overlapped took 5 to 13 minutes instead of 2 or 3, and
# twice that day E2E's webServer, which built the app too, ran out its 420s
# budget before running a test.
#
# Now `build` is the only job that prerenders. It waits until Vercel is not
# building, builds once, and hands `.next` to every job that needs a server;
# they only start it.
#
#   lint-test                         no database
#   build ──┬── routes                reads the build's prerender manifest
#           ├── e2e                   next start + Playwright
#           ├── lighthouse            next start + lhci
#           └── lighthouse-mobile     next start + lhci
jobs:
  lint-test:
    name: Lint, typecheck, unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Before setup-node, because it needs nothing but bash and this is the
      # cheapest possible way to fail a branch that rebased onto a renumbered
      # migration. Costs about a second. Invoked directly rather than through
      # `npm run db:check` so it doesn't depend on whatever npm the runner
      # image happens to ship; the npm script is there for local use.
      - name: Migration numbering
        run: bash scripts/check-migrations.sh

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (vitest)
        run: npm run test:run

  build:
    name: Build
    runs-on: ubuntu-latest
    # Up to 20 of these can be the wait below.
    timeout-minutes: 40
    permissions:
      contents: read
      # The wait step reads Vercel's commit statuses.
      statuses: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm ci

      # After Install, so the install overlaps Vercel's build rather than
      # queueing behind it. `main` is what production deploys, so a pull
      # request never prerenders while a merge is deploying; the second ref is
      # this run's own commit — its production build on a push, an opted-in
      # [preview] on a pull request. Fails open: it cannot fail the job, and
      # it stops waiting after 20 minutes.
      - name: Wait until Vercel is not building
        run: node scripts/ci/wait-for-vercel.mjs main "$HEAD_SHA"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Build
        run: npm run build

      # A tarball, not the directory: `.next/node_modules` holds Turbopack's
      # symlinks into node_modules (`postcss-<hash> -> ../../node_modules/postcss`),
      # which an artifact zip would follow or flatten. Every job that unpacks
      # this has run `npm ci` at the same path, so the links resolve there.
      # `.next/cache` is the compiler's cache; `next start` does not need it.
      - name: Package the build
        run: tar -I 'zstd -T0' -cf next-build.tar.zst --exclude=.next/cache .next

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: next-build.tar.zst
          # Already compressed.
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
          # Re-running this job replaces the artifact instead of failing on it.
          overwrite: true

      - name: Upload the prerender manifest
        uses: actions/upload-artifact@v4
        with:
          name: prerender-manifest
          path: .next/prerender-manifest.json
          retention-days: 1
          if-no-files-found: error
          overwrite: true

  # G-1. Reads .next/prerender-manifest.json and fails if a route that used to
  # prerender now renders on demand. Its own job, reading the build's manifest,
  # so a route that drifts reddens this check alone and cannot stop E2E or
  # Lighthouse from running. Drift here is often content rather than code: the
  # live CMS decides how many pages a pattern has.
  #
  # This guard has existed since P0 and had never run in CI — it was a script
  # somebody had to remember. It caught /sitemap.xml going dynamic during the
  # areas fold (#363) only because the fold's author ran it by hand. The
  # message-wave sweep touches ~270 files under [locale], where a missing
  # setRequestLocale is invisible in review and in every other gate.
  routes:
    name: Prerendered routes unchanged
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/download-artifact@v4
        with:
          name: prerender-manifest
          path: .next

      - name: Prerendered routes unchanged
        run: npm run check:routes

  e2e:
    name: E2E (Playwright)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Install Playwright Chromium
        # `--with-deps` runs `apt-get update` before installing Chromium's
        # SYSTEM libraries, all of which come from Ubuntu's own archives. It
        # does not need Google's repo — but the runner image ships a Google
        # apt source in sources.list.d, so `apt-get update` fetches that index
        # too and fails the whole step when it is unhealthy.
        #
        # Which it was, on 2026-09-09: Google's `Release` advertised
        # 233e56de… for main/binary-amd64/Packages.gz and served a file
        # hashing to bc1428ab…, so apt reported "Hash Sum mismatch", Playwright
        # reported "Failed to install browsers", and the job died in 51s having
        # run no test at all. Reproduced with curl from outside CI, so it was
        # upstream rather than anything about the branch — and it would have
        # taken `main` red on its next push just the same.
        #
        # Removing the source removes a dependency this job never had. If
        # Chrome itself is ever needed here (a `channel: "chrome"` project,
        # say), this has to go and the exposure comes back with it.
        run: |
          # Matched on CONTENT, not on filename. The first attempt removed
          # `google-chrome.list` — the name Chrome's own installer uses — and
          # the job failed identically, because the runner image ships this
          # repo under a different name and a different path
          # (dl.google.com/linux/chrome-stable/deb, not .../chrome/deb).
          # Grepping for the host catches every spelling, including deb822
          # `.sources` files.
          sudo grep -rlZ 'dl\.google\.com' /etc/apt/sources.list /etc/apt/sources.list.d/ 2>/dev/null \
            | sudo xargs -0 -r rm -v -f || true
          npx playwright install --with-deps chromium

      - name: Download the build
        uses: actions/download-artifact@v4
        with:
          name: next-build

      - name: Unpack the build
        run: tar -I zstd -xf next-build.tar.zst && rm next-build.tar.zst

      - name: Run Playwright
        run: npm run test:e2e
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SITE_URL: https://www.bazarrealestate.ae
          # Serve the `build` job's `.next` rather than building again — see
          # webServer in playwright.config.ts.
          PW_PREBUILT: "1"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  lighthouse:
    name: Lighthouse CI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Download the build
        uses: actions/download-artifact@v4
        with:
          name: next-build

      - name: Unpack the build
        run: tar -I zstd -xf next-build.tar.zst && rm next-build.tar.zst

      # The detail-page audit target has to be resolved, not hard-coded: the
      # catalogue is editor-owned, and naming a listing means the job 404s the
      # day it is unpublished. Read straight from Supabase rather than the app,
      # since lhci starts the server itself. No published property just means
      # two URLs get audited instead of three.
      - name: Resolve a published property for the detail-page audit
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          json=$(curl -sf \
            "$SUPABASE_URL/rest/v1/properties?select=slug,reference&status=eq.published&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY") || true
          slug=$(printf '%s' "$json" | sed -n 's/.*"slug":"\([^"]*\)".*/\1/p')
          # The route segment is "<slug>-<reference>", not the slug alone —
          # app/(public)/p/[slug] parses the reference back out of it and looks
          # the property up by that. The bare slug 404s.
          ref=$(printf '%s' "$json" | sed -n 's/.*"reference":"\([^"]*\)".*/\1/p' \
            | tr '[:upper:]' '[:lower:]')
          if [ -n "$slug" ] && [ -n "$ref" ]; then
            echo "LHCI_DETAIL_URL=http://127.0.0.1:3100/p/$slug-$ref" >> "$GITHUB_ENV"
            echo "Auditing property detail: /p/$slug-$ref"
          else
            echo "No published property found — auditing / and /buy only."
          fi

      - name: Run Lighthouse CI
        run: npx lhci autorun --config=./lighthouserc.cjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SITE_URL: https://www.bazarrealestate.ae

      - name: Upload Lighthouse report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: .lighthouseci/
          retention-days: 14

  # The mobile counterpart to the job above, and the reason it is a separate
  # job rather than a second config in the same one: lhci applies one settings
  # object per run, so desktop and mobile cannot share a process. Running them
  # in parallel also keeps each inside its own 20-minute cap.
  #
  # Lighthouse's DEFAULT emulation is mobile — Moto-G-class CPU throttling plus
  # simulated slow 4G. `lighthouserc.cjs` opts out of it; this one does not.
  # (There is no `preset: "mobile"`; passing one fails the run outright.)
  lighthouse-mobile:
    name: Lighthouse CI (mobile)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Download the build
        uses: actions/download-artifact@v4
        with:
          name: next-build

      - name: Unpack the build
        run: tar -I zstd -xf next-build.tar.zst && rm next-build.tar.zst

      # Same editor-owned-catalogue problem as the desktop job: the detail page
      # has to be resolved, never named. The property detail template is the
      # one that statically imports MapLibre, so it is the route the script
      # budget most needs to see.
      - name: Resolve a published property for the detail-page audit
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          json=$(curl -sf \
            "$SUPABASE_URL/rest/v1/properties?select=slug,reference&status=eq.published&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY") || true
          slug=$(printf '%s' "$json" | sed -n 's/.*"slug":"\([^"]*\)".*/\1/p')
          ref=$(printf '%s' "$json" | sed -n 's/.*"reference":"\([^"]*\)".*/\1/p' \
            | tr '[:upper:]' '[:lower:]')
          if [ -n "$slug" ] && [ -n "$ref" ]; then
            echo "LHCI_DETAIL_URL=http://127.0.0.1:3100/p/$slug-$ref" >> "$GITHUB_ENV"
            echo "Auditing property detail: /p/$slug-$ref"
          else
            echo "No published property found — auditing / and /buy only."
          fi

      - name: Run Lighthouse CI (mobile)
        run: npx lhci autorun --config=./lighthouserc.mobile.cjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SITE_URL: https://www.bazarrealestate.ae

      - name: Upload mobile Lighthouse report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report-mobile
          path: .lighthouseci/
          retention-days: 14
